<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>To-Do List</title>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-lg w-96">
        <h1 class="text-3xl font-bold text-center mb-6">
            My To-Do List
        </h1>

        <div class="flex gap-2 mb-4">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
                class="flex-1 border border-gray-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-400"
            >
            <button
                onclick="addTask()"
                class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded"
            >
                Add
            </button>
        </div>

        <ul id="taskList" class="space-y-2"></ul>
    </div>

    <script>
        function addTask() {
            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            let li = document.createElement("li");
            li.className =
                "flex justify-between items-center border-b pb-2";

            li.innerHTML = `
                <span>${task}</span>
                <button
                    onclick="deleteTask(this)"
                    class="text-red-500 hover:text-red-700"
                >
                    Delete
                </button>
            `;

            document.getElementById("taskList").appendChild(li);
            input.value = "";
        }

        function deleteTask(button) {
            button.parentElement.remove();
        }
    </script>

</body>
</html>
